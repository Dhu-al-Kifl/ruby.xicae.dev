<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Crimson & Obsidian Devil Glow Gradients -->
    <radialGradient id="irisRedGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="60%" stop-color="#990000" />
      <stop offset="90%" stop-color="#4a0000" />
      <stop offset="100%" stop-color="#110000" />
    </radialGradient>
    
    <linearGradient id="scaryRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#80001a" />
      <stop offset="100%" stop-color="#ff0033" />
    </linearGradient>

    <filter id="devilGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ancient Obsidian Dark Pyramid Frame -->
  <polygon points="50,4 96,92 4,92" stroke="url(#scaryRimGrad)" stroke-width="4" fill="#080405" stroke-linejoin="round" filter="url(#devilGlow)" />
  <polygon points="50,14 88,86 12,86" stroke="#33000a" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Veiny Bloodshot Outer Eye Sclera -->
  <path d="M 16,52 Q 50,18 84,52 Q 50,86 16,52 Z" fill="#140205" stroke="url(#scaryRimGrad)" stroke-width="2.5" />
  
  <!-- Red Vein Tendrils -->
  <path d="M 18,52 Q 30,48 38,52 M 82,52 Q 70,54 62,52 M 50,22 Q 48,34 50,40 M 50,82 Q 52,70 50,64" stroke="#ff0033" stroke-width="1.2" opacity="0.7" stroke-linecap="round" />

  <!-- Hyper-Detailed Scary Iris -->
  <circle cx="50" cy="52" r="18" fill="url(#irisRedGrad)" stroke="#ff0033" stroke-width="1.5" filter="url(#devilGlow)" />
  <circle cx="50" cy="52" r="14" stroke="#ff3355" stroke-width="1" stroke-dasharray="2 2" fill="none" />

  <!-- Demonic Reptilian Vertical Slit Pupil -->
  <path d="M 50,37 Q 44,52 50,67 Q 56,52 50,37 Z" fill="#000000" stroke="#ff0033" stroke-width="1" />

  <!-- Eerie Eye Specular Glint Reflection -->
  <ellipse cx="44" cy="44" rx="2.5" ry="4" fill="#ffffff" opacity="0.85" transform="rotate(-20 44 44)" />
  <circle cx="54" cy="58" r="1.5" fill="#ff6680" opacity="0.7" />
</svg>
